{% extends 'students/base.html' %}

{% block title %}
Add Student
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-header">

        <span>🎓</span>

        <h1>Add New Student</h1>

        <p>
            Enter student information below.
        </p>

    </div>


    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>
                Student Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter student name"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Phone
            </label>

            <input
                type="text"
                name="phone"
                placeholder="Enter phone number"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Course
            </label>

            <input
                type="text"
                name="course"
                placeholder="e.g. Computer Science"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Age
            </label>

            <input
                type="number"
                name="age"
                placeholder="Enter age"
                min="1"
                max="100"
                required
            >

        </div>


        <div class="form-actions">

            <a
                href="{% url 'student_list' %}"
                class="cancel-btn"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="save-btn"
            >
                💾 Save Student
            </button>

        </div>

    </form>

</div>

{% endblock %}
