{% extends 'gyn/base.html' %}
{% block page_title %}Add New Patient{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
    
    <div style="display: flex; justify-content: space-between; margin-bottom: 25px; border-bottom: 1px solid #e5e7eb; padding-bottom: 15px;">
        <h2 style="margin: 0; color: #0f766e;"><i class="fa-solid fa-user-plus"></i> Add New Patient</h2>
        <a href="{% url 'patients_dashboard' %}" style="color: #6b7280; text-decoration: none;">&larr; Back to Dashboard</a>
    </div>

    <form method="POST">
        {% csrf_token %}
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            
            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">Patient ID *</label>
                <input type="text" name="patient_id" value="{{ next_patient_id }}" required readonly class="filter-input" style="width: 100%; margin-top:5px; box-sizing: border-box; background-color: #f3f4f6; cursor: not-allowed; color: #6b7280; font-weight: bold;">
            </div>
            
            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">Full Name *</label>
                <input type="text" name="name" required class="filter-input" style="width: 100%; margin-top:5px; box-sizing: border-box;" placeholder="e.g. Batman Sharma">
            </div>

            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">Avatar Emoji</label>
                <input type="text" name="avatar_emoji" class="filter-input" style="width: 100%; margin-top:5px; box-sizing: border-box;" placeholder="e.g. 🦇, 👻, 👩">
            </div>

            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">Mobile Number *</label>
                <input type="text" name="mobile" required class="filter-input" style="width: 100%; margin-top:5px; box-sizing: border-box;" placeholder="9876543210">
            </div>

            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">Email Address</label>
                <input type="email" name="email" class="filter-input" style="width: 100%; margin-top:5px; box-sizing: border-box;" placeholder="patient@gmail.com">
            </div>

            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">Age *</label>
                <input type="number" name="age" required class="filter-input" style="width: 100%; margin-top:5px; box-sizing: border-box;" placeholder="28">
            </div>

            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">City *</label>
                <input type="text" name="city" required class="filter-input" style="width: 100%; margin-top:5px; box-sizing: border-box;" placeholder="Lucknow">
            </div>

            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">Status *</label>
                <select name="status" class="filter-select" style="width: 100%; margin-top:5px; box-sizing: border-box;">
                    <option value="Pregnant">Pregnant</option>
                    <option value="Postpartum">Postpartum</option>
                    <option value="Planning">Planning</option>
                    <option value="Not Pregnant">Not Pregnant</option>
                    <option value="No Show">No Show</option>
                </select>
            </div>

            <div>
                <label style="font-size: 13px; font-weight: 600; color:#374151;">Risk Level *</label>
                <select name="risk_level" class="filter-select" style="width: 100%; margin-top:5px; box-sizing: border-box;">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            
        </div>

        <div style="margin-top: 30px; text-align: right;">
            <button type="submit" class="btn-search" style="padding: 12px 30px; font-size:16px;">Save Patient Record</button>
        </div>
    </form>
</div>
{% endblock %}
